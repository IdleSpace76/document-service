version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: itq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - itq_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  itq_pgdata: